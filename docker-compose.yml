services:
  dockllama:
    image: ghcr.io/o51r15/dockllama:latest
    container_name: dockllama
    restart: unless-stopped
    ports:
      - "8556:8556"
    volumes:
      # Lets DockLlama see and restart containers on this machine.
      # (":ro" is left off on purpose: it doesn't restrict what can be done through the socket.)
      - /var/run/docker.sock:/var/run/docker.sock
      - dockllama-data:/app/data
      # Backups (Settings → Backup) land in a "backups" folder next to this file, so they
      # survive the container or its volume being removed.
      - ./backups:/app/backups
    extra_hosts:
      # Lets DockLlama reach an Ollama running on this same machine as host.docker.internal.
      - "host.docker.internal:host-gateway"
    # Optional: run as these user/group IDs (e.g. 99/100 on Unraid) when the data folder is a bind mount.
    # environment:
    #   - PUID=1000
    #   - PGID=1000
    #   # No password at all. Only on a private network: anyone who can open the page can restart containers.
    #   - DOCKLLAMA_LOGIN=off

volumes:
  dockllama-data:
