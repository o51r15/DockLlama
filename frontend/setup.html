<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up DockLlama</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/app.css">
<script defer src="static/vendor/alpine-3.17.5.min.js"></script>
</head>
<body>
<div class="center">
  <form class="card" x-data="setup()" x-cloak @submit.prevent="submit">
    <div class="brand"><img src="static/favicon.svg" alt=""><span>DockLlama</span></div>
    <h1>Create a password</h1>
    <p class="sub">You'll use it to sign in to DockLlama from any device.</p>

    <template x-if="!skip">
      <div>
        <label for="pw">Password</label>
        <input id="pw" type="password" x-model="password" autocomplete="new-password" autofocus>
        <div class="hint">At least 8 characters.</div>
        <label for="pw2">Type it again</label>
        <input id="pw2" type="password" x-model="password2" autocomplete="new-password">
      </div>
    </template>

    <label class="check">
      <input type="checkbox" x-model="skip">
      <span>Don't use a password. This is a private network.</span>
    </label>
    <div class="warning" x-show="skip">
      Anyone who can open this page will be able to restart your containers.
      You can turn the password on later in Settings.
    </div>

    <div class="error" x-show="error" x-text="error"></div>
    <button type="submit" :disabled="busy" x-text="busy ? 'Saving…' : 'Continue'"></button>
  </form>
</div>
<script>
function setup() {
  return {
    password: '', password2: '', skip: false, error: '', busy: false,
    async submit() {
      this.error = '';
      if (!this.skip) {
        if (this.password.length < 8) { this.error = 'Use at least 8 characters.'; return; }
        if (this.password !== this.password2) { this.error = "The two passwords don't match."; return; }
      }
      this.busy = true;
      let tz = 'UTC';
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) {}
      try {
        const r = await fetch('api/auth/setup', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: this.skip ? null : this.password, skip_password: this.skip, timezone: tz}),
        });
        if (r.ok || r.status === 409) { window.location.href = './'; return; }
        const d = await r.json().catch(() => ({}));
        this.error = d.detail || 'Something went wrong. Try again.';
      } catch (e) {
        this.error = "Can't reach DockLlama. Is it still running?";
      }
      this.busy = false;
    },
  };
}
</script>
</body>
</html>
