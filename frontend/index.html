<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DockLlama</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/app.css">
<script defer src="static/vendor/alpine-3.17.5.min.js"></script>
</head>
<body x-data="home()" x-init="load()" x-cloak>
<header class="top">
  <a class="brand" href="./" style="margin:0"><img src="static/favicon.svg" alt=""><span>DockLlama</span></a>
  <nav class="topnav">
    <a href="./" class="active">Dashboard</a>
    <a href="settings">Settings</a>
    <button class="secondary" x-show="loginRequired" @click="logout()">Sign out</button>
  </nav>
</header>
<main class="page">
  <h1>You're signed in</h1>
  <p class="sub">DockLlama v2 is being rebuilt. The rest of the setup and the dashboard come in the next steps.</p>
  <p class="hint">Version <span x-text="version"></span></p>
</main>
<script>
function home() {
  return {
    version: '', loginRequired: false,
    async load() {
      const [h, s] = await Promise.all([fetch('api/health'), fetch('api/auth/status')]);
      this.version = (await h.json()).version;
      this.loginRequired = (await s.json()).login_required;
    },
    async logout() {
      await fetch('api/auth/logout', {method: 'POST'});
      window.location.href = 'login';
    },
  };
}
</script>
</body>
</html>
