<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36">
<style>
  .lb { fill: #F5E6C8; }
  .ll { fill: #FFF3E0; }
  .ls { fill: #D4B88A; }
  .ld { fill: #B89868; }
  .c1 { fill: #3A9EC4; }
  .c2 { fill: #E05A40; }
  .lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; fill: currentColor; }
</style>

<!-- Mini shipping container stack -->
<rect x="1" y="16" width="10" height="9" rx="1" class="c1"/>
<rect x="1" y="10" width="10" height="5" rx="1" class="c2"/>
<line x1="4" y1="16" x2="4" y2="25" stroke="white" stroke-width="0.3" opacity="0.4"/>
<line x1="8" y1="16" x2="8" y2="25" stroke="white" stroke-width="0.3" opacity="0.4"/>

<!-- Mini llama -->
<g transform="translate(10, 2)">
  <!-- Body -->
  <ellipse cx="18" cy="22" rx="9" ry="5.5" class="lb"/>
  <path d="M10 20 Q11 18 13 19 Q14 17 16 19" class="ll" stroke="none"/>
  <!-- Legs -->
  <rect x="11" y="25" width="2" height="8" rx="0.5" class="lb"/>
  <rect x="14" y="25.5" width="2" height="7.5" rx="0.5" class="ls"/>
  <rect x="21" y="25" width="2" height="8" rx="0.5" class="lb"/>
  <rect x="24" y="25.5" width="2" height="7.5" rx="0.5" class="ls"/>
  <!-- Hooves -->
  <rect x="10.5" y="32" width="3" height="1.5" rx="0.5" class="ld"/>
  <rect x="13.5" y="32" width="3" height="1.5" rx="0.5" class="ld"/>
  <rect x="20.5" y="32" width="3" height="1.5" rx="0.5" class="ld"/>
  <rect x="23.5" y="32" width="3" height="1.5" rx="0.5" class="ld"/>
  <!-- Neck -->
  <path d="M13 19 Q12 12 13 7 Q14 5 15.5 5 Q17 5 18 7 Q19 12 17 19" class="lb" stroke="none"/>
  <path d="M12.5 17 Q11 15 12 13 Q11 11 12 9" fill="none" class="ls" stroke-width="0.8" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="16" cy="5" rx="5" ry="3" class="lb"/>
  <ellipse cx="20" cy="5.5" rx="3" ry="2" class="ll"/>
  <ellipse cx="22" cy="5" rx="1" ry="0.7" class="ld"/>
  <circle cx="17.5" cy="4.2" r="1" fill="#3A2A1A"/>
  <circle cx="17.8" cy="3.8" r="0.3" fill="white"/>
  <!-- Ears -->
  <path d="M14 3 Q13 -1 12 -2 Q13 -3 14 -2 Q15 0 15 2" class="lb" stroke="none"/>
  <path d="M17 2 Q18 -2 19 -3 Q20 -4 20.5 -3 Q20 -1 18.5 1.5" class="lb" stroke="none"/>
  <!-- Tail -->
  <circle cx="27" cy="19" r="2.5" class="ll"/>
  <circle cx="27.5" cy="18.5" r="1.5" class="lb"/>
</g>

<!-- Text -->
<text x="48" y="25" class="lt">
  <tspan style="font-weight: 400;">dock</tspan><tspan style="font-weight: 600; fill: #3A9EC4;">Llama</tspan>
</text>
</svg>